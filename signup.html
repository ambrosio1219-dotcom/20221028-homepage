{% extends "base.html" %}
{% block title %}회원가입 · GUITAR GALLERY{% endblock %}

{% block content %}
<section class="form-page">
    <div class="form-card">
        <p class="eyebrow">Join</p>
        <h1>회원가입</h1>
        <p class="desc">비밀번호는 암호화해서 저장하므로 관리자도 알 수 없습니다.</p>

        <form method="post">
            <label for="userid">아이디 <em>4자 이상</em></label>
            <input type="text" id="userid" name="userid" value="{{ userid }}" required autofocus>

            <label for="nickname">별명 <em>게시판에 표시됩니다</em></label>
            <input type="text" id="nickname" name="nickname" value="{{ nickname }}" required>

            <label for="password">비밀번호 <em>4자 이상</em></label>
            <input type="password" id="password" name="password" required>

            <label for="password2">비밀번호 확인</label>
            <input type="password" id="password2" name="password2" required>

            <button type="submit" class="btn-fill big full">가입하기</button>
        </form>

        <p class="form-foot">
            이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a>
        </p>
    </div>
</section>
{% endblock %}
